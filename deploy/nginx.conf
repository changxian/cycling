#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;
    limit_req_zone $binary_remote_addr zone=cycling_login:10m rate=10r/s;
    sendfile        on;
    keepalive_timeout  65;
    gzip  on;
    underscores_in_headers on;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name x-onepiece.ccwu.cc;

        ssl_certificate     /usr/local/nginx/conf/x-onepiece.ccwu.cc.pem;
        ssl_certificate_key /usr/local/nginx/conf/x-onepiece.ccwu.cc.key;

        # HTTP/2 支持,启用新一代协议提升并发性能
        # http2_max_field_size 4k;
        # http2_max_header_size 16k; # 这两个配置已过时，替换成如下的配置 large_client_header_buffers 4 16k;
        large_client_header_buffers 4 16k;
	    client_max_body_size 200M;


        # 启用 GZIP 压缩，减少传输数据量
        gzip on;
        # 可配置压缩级别和类型
        gzip_min_length 1k;
        gzip_types text/plain application/json application/javascript text/css;

        root /usr/local/nginx/html;
        index index.html index.htm;

        location = /_cycling_auth {
            internal;
            proxy_pass http://127.0.0.1:8000/api/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        location ^~ /cycling/ {
            auth_request off;
            auth_basic off;
            # Override inherited error_page rules that send visitors to the SPA.
            error_page 404 = @cycling_not_found;
            if ($uri !~ "^/cycling/[0-9]{8}(_[0-9]+)?\.html$") { return 404; }
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        # Exported pages are shareable. Their photos use this public, random-ID route.
        location ^~ /cycling/photos/thumbs/ {
            auth_request off;
            auth_basic off;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location ^~ /tmp/thumbs/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location ^~ /cycling/photos/ {
            auth_request off;
            auth_basic off;
            error_page 404 = @cycling_not_found;
            if ($uri !~ "^/cycling/photos/[a-f0-9]{32}\.(jpg|jpeg|png|webp)$") { return 404; }
            alias /usr/local/nginx/html/tmp/;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location @cycling_not_found {
            auth_request off;
            auth_basic off;
            default_type text/plain;
            return 404 "Story or photo not found.\n";
        }

        location ^~ /tmp/ {
            if ($uri !~ "^/tmp/[a-f0-9]{32}\.(jpg|jpeg|png|webp)$") { return 404; }
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /api/login {
            limit_req zone=cycling_login burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location = /api/register {
            limit_req zone=cycling_login burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_read_timeout 150s;
        }

        location /assets/ {
            try_files $uri =404;
            expires off;
            add_header Cache-Control "no-cache" always;
        }

        location /src/ {
            try_files $uri =404;
            # 模块升级后必须取新内容，避免旧视图读取已弃用的数据字段。
            expires off;
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store" always;
        }

        location = /index.html {
            expires off;
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store" always;
        }

        # SPA page: serve the frontend entry, not a file named story-schemes.
        # Keep this exact match so older location / allowlists cannot reject it.
        location = /story-schemes {
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
        }

        location = /story-schemes/ {
            return 302 /story-schemes$is_args$args;
        }

        location / {
            if ($uri !~ "^/(login|register|settings|story-schemes|gallery|generate)?$") { return 404; }
            try_files /index.html =404;
            add_header Cache-Control "no-store";
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # HTTP 块 — 处理 80 端口
    server {
        listen 80;
        server_name x-onepiece.ccwu.cc;

        # 可选：HTTP 全部强制跳转到 HTTPS
        return 301 https://$host$request_uri;
    }

}
