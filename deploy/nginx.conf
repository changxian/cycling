# Add inside nginx's http {} block. Requires ngx_http_auth_request_module.
limit_req_zone $binary_remote_addr zone=cycling_login:10m rate=5r/m;

server {
    listen 80;
    server_name cycling.example.com;
    client_max_body_size 300m;
    root /opt/cycling/frontend;
    index index.html;

    location = /_cycling_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location ^~ /cycling/ {
        if ($uri !~ "^/cycling/[0-9]{8}\.html$") { return 404; }
        auth_request /_cycling_auth;
        error_page 401 =302 /login;
        root /usr/local/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ^~ /tmp/ {
        if ($uri !~ "^/tmp/[a-f0-9]{32}\.jpg$") { return 404; }
        auth_request /_cycling_auth;
        error_page 401 =302 /login;
        root /usr/local/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/login {
        limit_req zone=cycling_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 150s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /src/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        if ($uri !~ "^/(login|settings|gallery|generate)?$") { return 404; }
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }
}
