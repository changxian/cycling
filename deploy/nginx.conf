# Add inside nginx's http {} block. Requires ngx_http_auth_request_module.
limit_req_zone $binary_remote_addr zone=cycling_login:10m rate=5r/m;

server {
    listen 80;
    server_name cycling.example.com;
    client_max_body_size 300m;
    root /opt/cycling/frontend;
    index index.html;

    location = /_cycling_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location ^~ /cycling/ {
        auth_request off;
        auth_basic off;
        # Override inherited error_page rules that send visitors to the SPA.
        error_page 404 = @cycling_not_found;
        if ($uri !~ "^/cycling/[0-9]{8}\.html$") { return 404; }
        root /usr/local/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Exported pages are shareable. Their photos use this public, random-ID route.
    location ^~ /cycling/photos/ {
        auth_request off;
        auth_basic off;
        error_page 404 = @cycling_not_found;
        if ($uri !~ "^/cycling/photos/[a-f0-9]{32}\.(jpg|jpeg|png|webp)$") { return 404; }
        alias /usr/local/nginx/html/tmp/;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @cycling_not_found {
        auth_request off;
        auth_basic off;
        default_type text/plain;
        return 404 "Story or photo not found.\n";
    }

    location ^~ /tmp/ {
        if ($uri !~ "^/tmp/[a-f0-9]{32}\.(jpg|jpeg|png|webp)$") { return 404; }
        auth_request /_cycling_auth;
        error_page 401 =302 /login;
        root /usr/local/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/login {
        limit_req zone=cycling_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 150s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /src/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA page: serve the frontend entry, not a file named story-schemes.
    # Keep this exact match so older location / allowlists cannot reject it.
    location = /story-schemes {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /story-schemes/ {
        return 302 /story-schemes$is_args$args;
    }

    location / {
        if ($uri !~ "^/(login|settings|story-schemes|gallery|generate)?$") { return 404; }
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }
}
