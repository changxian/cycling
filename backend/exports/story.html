<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="{{ record.entries[0].text[:120] }}"><title>{{ record.title }}</title><style>{{ story_css|safe }}</style></head>
<body class="standalone-story"><main>{% include 'story_content.html' %}</main><script>(function(){document.querySelectorAll('[data-carousel]').forEach(function(carousel){var slides=[].slice.call(carousel.querySelectorAll('.story-slide')),count=carousel.querySelector('.carousel-count'),index=0,timer;function show(next){index=(next+slides.length)%slides.length;slides.forEach(function(slide,i){slide.classList.toggle('is-active',i===index);slide.tabIndex=i===index?0:-1});count.textContent=(index+1)+' / '+slides.length}function play(){clearInterval(timer);timer=setInterval(function(){show(index+1)},5000)}carousel.querySelector('[data-carousel-prev]').addEventListener('click',function(){show(index-1);play()});carousel.querySelector('[data-carousel-next]').addEventListener('click',function(){show(index+1);play()});carousel.addEventListener('mouseenter',function(){clearInterval(timer)});carousel.addEventListener('mouseleave',play);carousel.addEventListener('focusin',function(){clearInterval(timer)});carousel.addEventListener('focusout',play);show(0);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)play()})})();</script></body></html>
