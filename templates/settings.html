{% extends 'base.html' %}
{% block title %}AI 配置 · 骑行时光机{% endblock %}
{% block content %}
<div class="settings-layout">
  <div class="page-heading"><div><div class="eyebrow"><span></span> THE WORDS BEHIND THE RIDE</div><h1>AI 配置</h1><p class="lead">连接你的创作搭档。</p></div><span class="heading-icon"><i data-lucide="sliders-horizontal"></i></span></div>
  <form id="settings-form" action="{{ url_for('save_settings') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="settings-status"><span class="status-dot {{ 'connected' if config else '' }}"></span>{{ '配置已保存' if config else '尚未配置' }}</div>
    <label>Base URL <span class="required">必填</span><input type="url" name="base_url" value="{{ config.get('base_url', '') }}" placeholder="https://api.example.com/v1" required autocomplete="url"></label>
    <label>API Key <span class="required">{{ '已保存' if config else '必填' }}</span><span class="password-field"><input type="password" name="api_key" id="api-key" placeholder="{{ '留空保留当前密钥' if config else 'sk-…' }}" autocomplete="new-password" {% if not config %}required{% endif %}><button class="icon-button password-toggle" type="button" data-target="api-key" aria-label="显示密钥" title="显示密钥"><i data-lucide="eye"></i></button></span></label>
    <label>模型名称 <span class="required">选填</span><input name="model" placeholder="gpt-4o" value="{{ config.get('model', 'gpt-4o') }}"></label>
    <p class="settings-note"><i data-lucide="image"></i>上传照片时，请使用支持图片输入的模型。</p>
    {% for message in get_flashed_messages() %}<div class="notice success" role="status">{{ message }}</div>{% endfor %}
    <div id="settings-message" class="notice" role="status" hidden></div>
    <div class="settings-actions"><a class="text-link" href="{{ url_for('index') }}"><i data-lucide="arrow-left"></i>返回记录</a><button type="submit" class="button primary"><i data-lucide="save"></i>保存配置</button></div>
  </form>
</div>
{% endblock %}
