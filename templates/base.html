<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="骑行时光机，记录每一程的风景与心情。">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}骑行时光机{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head %}{% endblock %}
  <script src="{{ url_for('static', filename='lucide.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span class="brand-icon"><i data-lucide="bike"></i></span><span>骑行时光机<small>CYCLING JOURNAL</small></span></a>
    {% if session.get('logged_in') %}
    <nav aria-label="主导航">
      <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}><i data-lucide="circle-plus"></i><span>记录骑行</span></a>
      <a href="{{ url_for('gallery') }}" {% if request.endpoint == 'gallery' %}aria-current="page"{% endif %}><i data-lucide="images"></i><span>时光画廊</span></a>
      <a href="{{ url_for('settings') }}" {% if request.endpoint == 'settings' %}aria-current="page"{% endif %}><i data-lucide="sliders-horizontal"></i><span>AI 配置</span></a>
    </nav>
    <form action="{{ url_for('logout') }}" method="post" class="logout-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="icon-button" aria-label="退出登录" title="退出登录"><i data-lucide="log-out"></i></button></form>
    {% else %}<span class="nav-note">每一程，都值得被记住。</span>{% endif %}
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  <footer class="footer"><span>骑行时光机 <span class="footer-dot">·</span> 把日子骑成故事</span><a href="{{ url_for('index') }}">回到首页 <i data-lucide="arrow-up-right"></i></a></footer>
</body>
</html>
